name: Tests

on:
  workflow_dispatch:  # allow to run manually
  push:
  pull_request:

permissions: {}

jobs:

  tests:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Tests

    steps:
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install \
          build-essential \
          build-essential \
          ca-certificates \
          curl \
          git \
          gcc \
          g++ \
          libc-dev \
          libffi-dev \
          libmagic1 \
          libpq-dev \
          libssl-dev \
          postgresql \
          postgresql-contrib

    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Get branch name (merge)
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        echo "CODECOV_BRANCH=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" \
             >> $GITHUB_ENV

    - name: Get branch name (pull request)
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "CODECOV_BRANCH=$(echo ${GITHUB_HEAD_REF} | tr / -)" \
             >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sed -i 's/psycopg\[c\]/psycopg[binary]/g' requirements.txt
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r test_requirements.txt
        pip install pytest-codecov[git]

    - name: Run tests
      run: py.test --cov --codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Linting
      run: flake8 src/ tests/ stubs/

    - name: Check security issues
      run: bash bandit.sh
      env:
        SKIP_VENV: 1

    - name: Static type checking
      run: bash mypy.sh
      env:
        SKIP_VENV: 1
